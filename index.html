<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {

  authDomain: "icd-cd-monitor.firebaseapp.com",

  messagingSenderId: "654515474241",
  appId: "1:654515474241:web:f728c6ce3e8f79a3d4dbc0"
};

const firebaseApp = initializeApp(firebaseConfig);
const db = getFirestore(firebaseApp);
window.__firestore = { db, doc, getDoc };
// Firebase config and initialization (see bottom of file for the module setup).
const FUNCTIONS_BASE = {
  updateSnapshot: "https://updatesnapshot-unx5ssbpva-uc.a.run.app",
  generateCase: "https://generatecase-unx5ssbpva-uc.a.run.app",
  askFinancialQuestion: "https://us-central1-icd-cd-monitor.cloudfunctions.net/askFinancialQuestion"
};

function pillClass(pill) {
  const p = (pill || "").toLowerCase();
  if (p === "declining") return "declining";
  if (p === "rising" || p === "mixed") return "mixed";
  return "";
}

function outlookArrow(direction) {
  if (direction === "higher") return "&#8593;";
  if (direction === "flat") return "&#8594;";
  return "&#8595;";
}

const TILT_THRESHOLD = 8;

// MODEL A — "Endpoint tilt": compares the net lean (hike% − cut%) at the very
// next meeting against the net lean 12 months out. Answers: "is the pull on
// rates, apart from Hold, shifting direction between now and 12 months out?"
function deriveOutlookCustomer(fedwatch) {
  const lean = p => p.hike - p.cut;
  const nextLean = lean(fedwatch[0].probs);
  const farLean = lean(fedwatch[fedwatch.length - 1].probs);
  const shift = farLean - nextLean;

  const topAtAll = fedwatch.every(row => {
    const p = row.probs;
    return Object.keys(p).reduce((a, b) => p[a] >= p[b] ? a : b) === "hold";
  });

  let direction, tilt;
  if (Math.abs(shift) < TILT_THRESHOLD) {
    direction = "flat";
    tilt = "holding steady";
  } else if (shift < 0) {
    direction = "lower";
    tilt = "toward a cut";
  } else {
    direction = "higher";
    tilt = "toward a hike";
  }

  const text = direction === "flat"
    ? (topAtAll
        ? "Hold remains most likely at every horizon — odds are roughly steady out to 12 months."
        : "Odds are roughly steady out to 12 months, with no clear directional shift.")
    : (topAtAll
        ? `Hold remains most likely throughout, though the odds tilt ${tilt} by the 12-month mark.`
        : `Odds tilt increasingly ${tilt} by the 12-month mark.`);

  return { direction, tilt, text };
}

// MODEL B — "Executive blended average": the question a CD-pricing executive
// actually asks isn't "what changes between two points" — it's "what's the
// probability-weighted expected pressure on rates averaged across the CD's
// ENTIRE 12-month holding period." Averages the net lean across all three
// horizons into one blended read, rather than comparing two endpoints.
function deriveOutlookExecutive(fedwatch) {
  const lean = p => p.hike - p.cut;
  const leans = fedwatch.map(row => lean(row.probs));
  const avg = leans.reduce((a, b) => a + b, 0) / leans.length;

  let direction, tilt;
  if (Math.abs(avg) < TILT_THRESHOLD) {
    direction = "flat";
    tilt = "holding steady";
  } else if (avg < 0) {
    direction = "lower";
    tilt = "toward a cut";
  } else {
    direction = "higher";
    tilt = "toward a hike";
  }

  const text = direction === "flat"
    ? "Averaged across the full 12-month holding period, expected rate pressure is roughly balanced — no strong lean either way."
    : `Averaged across the full 12-month holding period, expected rate pressure tilts ${tilt} overall.`;

  return { direction, tilt, text };
}

  if (outlook.direction === "flat") {
    return `Don't take less than <b>${median}</b> — Fed rates holding steady, no urgency either way.`;
  }
  const urgency = outlook.direction === "lower" ? "worth locking in soon" : "worth holding out for more";
  return `Don't take less than <b>${median}</b> — Fed odds tilt ${outlook.tilt}, ${urgency}.`;
}

async function loadSnapshot() {
  const { db, doc, getDoc } = window.__firestore;
  const snap = await getDoc(doc(db, "icd", "snapshot"));
  if (!snap.exists()) return null;
  const data = snap.data();
  // A fresh document created before any real Update has ever run (see the
  // security-rules setup) only has a placeholder field -- treat that as "no
  // real data yet" too, not as a snapshot to render.
  if (!data.yields || !data.fedwatch || !data.bankrate) return null;
  return data;
}

function render(data) {
  // Extracts "Sep 16" from "Sep 15–16, 2026" (or "Sep 16" from "Sep 16, 2026"
  // if there's no range) -- CME associates its probability data with the
  // meeting's announcement day, which is the LAST day of a multi-day meeting,
  // not the first. Showing the first day was a real bug caught during testing.
  const shortMeetingDate = dateStr => {
    const monthDayPart = String(dateStr).split(',')[0].trim();
    const spaceIdx = monthDayPart.indexOf(' ');
    if (spaceIdx === -1) return monthDayPart;
    const month = monthDayPart.slice(0, spaceIdx);
    const dayPart = monthDayPart.slice(spaceIdx + 1);
    const lastDay = dayPart.split('–').pop().split('-').pop().trim();
    return `${month} ${lastDay}`;
  };
  lastLoadedData = data;
  const outlook = OUTLOOK_MODELS[currentOutlookModel].fn(data.fedwatch);
  const parsePct = s => parseFloat(String(s).replace('%', '')) || 0;
  const rLow = parsePct(data.range12mo.low);
  const rHigh = parsePct(data.range12mo.high);
  const rMedian = parsePct(data.range12mo.median);
  const posOnTrack = v => {
    if (rHigh === rLow) return 50;
    const p = ((v - rLow) / (rHigh - rLow)) * 100;
    return Math.max(2, Math.min(98, p));
  };
  const medianPos = posOnTrack(rMedian);

  const parsePctY = s => parseFloat(String(s).replace('%', '')) || 0;
  const yieldsHtml = data.yields.map(y => {
    const tbill = data.tbills ? data.tbills[y.term] : undefined;
    let deltaHtml = "";
    if (tbill !== undefined && tbill !== null) {
      const delta = parsePctY(y.apy) - tbill;
      const cls = delta >= 0 ? "delta-pos" : "delta-neg";
      deltaHtml = `<span class="yield-delta ${cls}">vs T-Bill at ${tbill.toFixed(2)}%</span>`;
    }
    const showPicksIcon = y.term === '12-Month' && data.topPicks && data.topPicks.length;
    const picksIconHtml = showPicksIcon ? `<span class="picks-row-icon" onclick="openTopPicksModal()" title="Top CD Picks">&#9432;</span>` : "";
    return `<div class="yield-row ${y.term === '12-Month' ? 'primary' : ''}">
      <span class="yield-term">${y.term}${picksIconHtml}</span>
      <span class="yield-right"><span class="yield-apy">${y.apy}</span>${deltaHtml}</span>
    </div>`;
  }).join("");

  const fedwatchRows = data.fedwatch.map((row, i) => {
    const p = row.probs;
    const top = Object.keys(p).reduce((a, b) => p[a] >= p[b] ? a : b);
    const cellHtml = key => `<span class="heat-cell ${key === top ? 'top' : ''}">${p[key]}%</span>`;
    return `
    <div class="heat-row ${i === 0 ? 'primary' : ''}">
      <span class="heat-label" title="${row.date}">${row.horizon} · ${shortMeetingDate(row.date)}</span>
      ${cellHtml('cut')}
      ${cellHtml('hold')}
      ${cellHtml('hike')}
    </div>`;
  }).join("");

  document.getElementById("app").innerHTML = `
    <div class="header-row">
      <div>
        <div class="eyebrow">CD Assistant</div>
        <div class="updated"><span class="dot"></span>Last updated ${data.updated}</div>
      </div>
      <button class="header-refresh-btn" id="refreshBtn" onclick="refreshSnapshot()" title="Update">
        <span class="header-refresh-icon" id="refreshIcon">&#8635;</span>
      </button>
    </div>
    <div class="update-msg" id="testMsg"></div>

    <div class="model-toggle">
      <span class="model-toggle-label">Persona</span>
      <div class="model-toggle-btns">
        <button class="model-btn ${currentOutlookModel === 'customer' ? 'active' : ''}" onclick="setOutlookModel('customer')">Bank Customer</button>
        <button class="model-btn ${currentOutlookModel === 'executive' ? 'active' : ''}" onclick="setOutlookModel('executive')">Bank Executive</button>
      </div>
    </div>

    <div class="section">
      <div class="section-head">
        <div class="section-title">12-Month CDs</div>
        <div class="section-sub">Today's Range</div>
      </div>
      <div class="card range-card">
        <div class="range-labels">
          <div class="range-item">
            <span class="range-tag">Low</span>
            <span class="range-val">${data.range12mo.low}</span>
          </div>
          <div class="range-item range-item-high">
            <span class="range-tag">High</span>
            <span class="range-val">${data.range12mo.high}</span>
          </div>
        </div>
        <div class="range-track">
          <div class="range-fill"></div>
          <div class="range-dot" style="left:0%"></div>
          <div class="range-dot" style="left:100%"></div>
          <div class="range-median-tri" style="left:${medianPos}%" title="Median"></div>
        </div>
        <div class="range-legend">
          <span class="legend-item median"><span class="legend-tri"></span>Median <b>${data.range12mo.median}</b></span>
        </div>
        <div class="quick-rule">
          <span class="quick-rule-arrow">${outlookArrow(outlook.direction)}</span>
          <span class="quick-rule-text">${quickRuleText(outlook, data.range12mo.median)}</span>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-head">
        <div class="section-title">Fidelity</div>

      </div>
      <div class="card">${yieldsHtml}</div>
    </div>

    <div class="section">

          <span class="br-pub">${data.bankrate.published}</span>

function copyCase() {
  const btn = document.getElementById("copyBtn");
  const label = document.getElementById("copyLabel");
  if (!lastCaseText || !btn) return;

  const SOURCE_URL = "https://www.cmegroup.com/markets/interest-rates/cme-fedwatch-tool.html";
  const copyText = `${lastCaseText}\n\nSource: FedWatch - CME Group — ${SOURCE_URL}`;

  function flashCopied(text, isSuccess) {
    if (isSuccess) btn.classList.add("copied");
    label.textContent = text;
    setTimeout(() => {
      btn.classList.remove("copied");
      label.textContent = "Copy";
    }, isSuccess ? 1600 : 2500);
  }

  function legacyCopy() {
    try {
      const ta = document.createElement("textarea");
      ta.value = copyText;
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      ta.style.top = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    } catch (e) {
      return false;
    }
  }

  function selectForManualCopy() {
    // Leave a visible, pre-selected textarea containing the full text (case +
    // source) so the person can copy it by hand even when both programmatic
    // methods are blocked — more reliable than selecting rendered page text,
    // since it guarantees the source line is included either way.
    try {
      const ta = document.createElement("textarea");
      ta.value = copyText;
      ta.className = "case-manual-ta";
      ta.readOnly = true;
      const card = btn.closest(".case-card");
      if (card) card.appendChild(ta);
      ta.focus();
      ta.select();
    } catch (e) { /* ignore */ }
    flashCopied("Selected below — press Cmd+C", false);
  }

  // Try the modern Clipboard API first.
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(copyText).then(() => {
      flashCopied("Copied!", true);
    }).catch(() => {
      // Fall back to the older execCommand method, common inside sandboxed iframes
      // where the Clipboard API is blocked by permissions policy.
      if (legacyCopy()) {
        flashCopied("Copied!", true);
      } else {
        selectForManualCopy();
      }
    });
  } else if (legacyCopy()) {
    flashCopied("Copied!", true);
  } else {
    selectForManualCopy();
  }
}

async function generateCase() {
  const btn = document.getElementById("caseBtn");
  const dot = document.getElementById("caseDot");
  const label = document.getElementById("caseLabel");

  if (!lastLoadedData) return;
  const r = lastLoadedData.range12mo;
  const outlook = OUTLOOK_MODELS.executive.fn(lastLoadedData.fedwatch);

  btn.disabled = true;
  dot.className = "status-dot busy";
  label.textContent = "Generating…";

  try {
    const response = await fetch(FUNCTIONS_BASE.generateCase, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ low: r.low, high: r.high, median: r.median, outlookText: outlook.text })
    });
    const result = await response.json();
    if (!result.ok || !result.text) throw new Error(result.error || "No case text returned");

    lastCaseText = result.text;
    render(lastLoadedData);
  } catch (err) {
    lastCaseText = null;
    render(lastLoadedData);
    const freshResult = document.getElementById("caseResult");
    if (freshResult) {
      freshResult.innerHTML = `<span class="case-placeholder">Generation failed — try again. (${err.message})</span>`;
    }
  }
}

function getRecentQuestions() {

function saveRecentQuestions(arr) {

function escapeHtml(s) {

// ---- Top CD Picks -- fully computed from real data, no AI involved ----
// Every fact here (call-protection, insurer type, the excluded callable
// comparison) is computed server-side from the Fidelity CSV, same as the
// 5-term yields. Deliberately templated, not AI-generated, since every
// sentence is a verifiable fact -- same reasoning that moved FedWatch and
// Fidelity's own numbers off AI search earlier this session.
function buildTopPicksCommentary(data) {
  const picks = data.topPicks || [];
  const excluded = data.topPicksExcludedCallable;
  const insurerSet = new Set(picks.map(p => p.insurer));
  const sameInsurer = insurerSet.size === 1 ? [...insurerSet][0] : null;

  const shortText = picks.length === 0
    ? "No qualifying candidates found in the latest Fidelity data."
    : sameInsurer
    ? `All ${picks.length} top picks are call-protected, ${sameInsurer}-insured CDs at ${picks[0].yield}%.${excluded ? ` The only callable offer in the top 10 (${excluded.issuer}, ${excluded.yield}%) was excluded${excluded.wouldHaveOutranked ? "." : " -- its rate wouldn't have beaten these anyway."}` : ""}`
    : `Top ${picks.length} picks span ${[...insurerSet].join(" and ")} coverage, all call-protected, led by ${picks[0].yield}%.`;

  const fullParagraphs = [
    `Ranked using three rules, in order: exclude anything callable first, since a callable CD's higher rate is compensation for the issuer's option to redeem early if rates fall -- not free extra return. Sort what's left by yield. Use available quantity as a tiebreaker only, since it signals how likely an offer is to still be there when you actually order, not how safe it is.`,
    sameInsurer
      ? `All ${picks.length} top picks happen to be ${sameInsurer}-insured credit union CDs this week, tied at ${picks[0].yield}%. That's not a safety signal either way -- ${sameInsurer} insurance provides essentially the same protection as FDIC (same $250,000 per-depositor coverage, same federal backing) -- it's simply where the best rate happens to sit right now.`
      : `This week's top picks span both ${[...insurerSet].join(" and ")} coverage -- both provide equivalent federal deposit insurance up to $250,000 per depositor.`,
  ];
  if (excluded) {
    fullParagraphs.push(
      `${excluded.issuer} offered ${excluded.yield}% -- the best rate among callable CDs in the list -- but was excluded because it isn't call-protected. ${excluded.wouldHaveOutranked ? "Its yield would have outranked these picks on rate alone, which is exactly why the callable filter matters." : "Its rate wouldn't have outranked any of these picks anyway, so excluding it costs nothing this week."}`
    );
  }
  fullParagraphs.push(
    `One practical note if a top pick is a credit union: buying it directly usually requires membership eligibility, but purchasing through a brokerage like Fidelity typically handles that automatically -- worth a quick confirmation with Fidelity if this is new to you.`
  );

  return { shortText, fullParagraphs };
}

async function refreshSnapshot() {
  const btn = document.getElementById("refreshBtn");
  const icon = document.getElementById("refreshIcon");
  const msg = document.getElementById("testMsg");

  btn.disabled = true;
  btn.classList.remove("ok", "err");
  icon.classList.add("spinning");
  if (msg) msg.textContent = "";

  try {
    const response = await fetch(FUNCTIONS_BASE.updateSnapshot, { method: "POST" });
    const result = await response.json();
    if (!result.ok) throw new Error(result.error || "Update failed");

    // The function already wrote the fresh snapshot to Firestore -- read it
    // back so the app displays exactly what's now stored, not a guess.
    const fresh = await loadSnapshot();
    if (!fresh) throw new Error("Update succeeded but snapshot could not be reloaded");

    render(fresh);
    // render() rebuilt the DOM, so re-grab the (new) button/icon before flashing success.
    const newBtn = document.getElementById("refreshBtn");
    const newMsg = document.getElementById("testMsg");
    if (newBtn) {
      newBtn.classList.add("ok");
      setTimeout(() => newBtn.classList.remove("ok"), 1800);
    }
    if (newMsg) newMsg.textContent = "Updated successfully.";
  } catch (err) {
    icon.classList.remove("spinning");
    btn.classList.add("err");
    btn.disabled = false;
    if (msg) msg.textContent = "Update failed — kept the last snapshot. (" + err.message + ")";
  }
}

  try {
    const data = await loadSnapshot();
    if (!data) {
      document.getElementById("app").innerHTML = `
        <div class="eyebrow">CD Assistant</div>

          No snapshot yet.<br><br>
          Press the button below to pull today's numbers for the first time.

          <button class="header-refresh-btn" id="refreshBtn" onclick="refreshSnapshot()" title="Update">

          </button>
        </div>
        <div class="update-msg" id="testMsg" style="text-align:center; margin-top:10px;"></div>
      `;
      return;
    }
    render(data);
  } catch (err) {
    document.getElementById("app").innerHTML = `<div class="loading">Couldn't load the snapshot. (${err.message})</div>`;
  }
}

// iOS often freezes a home-screen web app in the background rather than
// closing it, then silently resumes the exact same frozen page later --
// without ever re-fetching data. Left alone, that means reopening the app
// can show stale numbers even though Update was pressed elsewhere in the
// meantime. Re-running loadAndRender() whenever the app becomes visible
// again fixes this permanently, so it's never something to think about.
let isResumeRefreshing = false;
async function refreshOnResume() {
  if (isResumeRefreshing) return;
  if (currentView !== "dashboard") return; // don't clobber an in-progress question
  isResumeRefreshing = true;
  try {
    await loadAndRender();
  } finally {
    isResumeRefreshing = false;
  }
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") refreshOnResume();
});

// A second, complementary signal -- covers cases where the browser restores
// the page from its own back-forward cache rather than firing a visibility
// change (event.persisted marks a page shown from that cache, not a fresh load).
window.addEventListener("pageshow", (event) => {
  if (event.persisted) refreshOnResume();
});

loadAndRender();

// The onclick attributes in render() resolve against the global scope, but
// this script is a module (needed for the Firebase imports below), and
// module-level functions aren't automatically global -- so they're attached
// to window explicitly here.
window.setOutlookModel = setOutlookModel;
window.generateCase = generateCase;
window.copyCase = copyCase;
window.refreshSnapshot = refreshSnapshot;
window.showAskScreen = showAskScreen;
window.showDashboard = showDashboard;
window.askFinancialQuestion = askFinancialQuestion;
window.reuseQuestionAt = reuseQuestionAt;
window.deleteRecentQuestion = deleteRecentQuestion;
window.clearRecentQuestions = clearRecentQuestions;
window.closeAskAnswer = closeAskAnswer;
window.openTopPicksModal = openTopPicksModal;
window.closeTopPicksModal = closeTopPicksModal;
window.toggleTopPicksCommentary = toggleTopPicksCommentary;

</script>
